name: Package installers (intl)

# Builds the Windows (.exe / nsis) and macOS (.dmg, arm64) installers for the
# international edition (NEXT_PUBLIC_APP_EDITION=intl) using the `dist:win` /
# `dist:mac` scripts in package.json.
#
# Triggers:
#   - pushing a version tag like `v1.2.3`  -> builds + attaches to a GitHub Release
#   - manual run from the Actions tab (workflow_dispatch)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Allow the release job to create/update a Release and upload assets.
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Raised from 60: this job now builds a runtime of 205 crates, runs both test suites and packages an
    # installer. A cold Windows leg is the slowest path through the whole pipeline.
    timeout-minutes: 90

    # The committed .npmrc points at China mirrors (registry.npmmirror.com + npmmirror's
    # electron / electron-builder-binaries mirrors) for local dev. GitHub's runners are in
    # Azure outside mainland China, where those mirrors are slow and intermittently fail.
    # Env vars take precedence over .npmrc, so this redirects CI to the upstream sources
    # without touching the local setup. Applies to every step in the job (the Electron
    # binary is fetched during install, electron-builder's tooling during the build).
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      # No trailing "v" here: @electron/get appends its own "v${version}/" directory, so a
      # trailing "v" yields .../download/vv42.4.0/... and 404s. (npmmirror's layout in
      # .npmrc differs, which is why that one carries the "v".)
      NPM_CONFIG_ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      NPM_CONFIG_ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            script: dist:win
            # nsis installer + blockmap + latest.yml (the auto-update manifest electron-updater
            # reads; without it on the release, no client can discover an update).
            artifact_glob: |
              dist-electron/*.exe
              dist-electron/*.exe.blockmap
              dist-electron/latest.yml
          - name: macos
            os: macos-14 # arm64 runner: mac target is arm64-only
            script: dist:mac
            # dmg = first install; zip = what Squirrel.Mac actually updates from; latest-mac.yml
            # = the manifest pointing at the zip. All three must be on the release.
            artifact_glob: |
              dist-electron/*.dmg
              dist-electron/*.dmg.blockmap
              dist-electron/*.zip
              dist-electron/*.zip.blockmap
              dist-electron/latest-mac.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Rust Agent Runtime sidecar is built on each runner for its OWN host triple — no
      # cross-compilation: the mac target is arm64-only on an arm64 runner, the win target x64-only on
      # an x64 runner. If an x64 mac build ever returns, this needs a --target, not a cross toolchain.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # A release build of the workspace is a couple of minutes cold and seconds warm. Keyed on
      # Cargo.lock via the action's own hashing, and scoped per-runner so the two matrix legs do not
      # trample each other's target dir.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
          key: ${{ matrix.name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 22, matching ci.yml. Not cosmetic: `npm test` below is `node --test "test/**/*.test.mjs"`, and
      # glob patterns in the test runner need Node >= 21 — on 20 that exact command fails with
      # "Could not find '...test\**\*.test.mjs'" and exits 1.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Cache electron + electron-builder downloads (Electron binary, app-builder,
      # winCodeSign, nsis, etc.) to speed up subsequent runs.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-eb-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-eb-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Report which of the required values actually reached the runner, then fail with a
      # clear message. Without this, a missing value surfaces as an opaque Zod "Invalid URL"
      # from next.config.ts, three layers downstream of the real cause.
      # Only booleans and a length are printed — never a value.
      # Run the Rust tests on the platform that will ship the binary. Landlock, process groups and the
      # SIGTERM escalation are all platform behaviour, so a green Linux run says nothing about the
      # artefact a user installs. Cheap insurance against shipping a sidecar that cannot start.
      # Wall-clock capped, and this is not belt-and-braces: a Windows run of these tests hung for
      # 17 minutes and only ended when the JOB timed out, which costs a runner and tells you nothing.
      # `cargo test` has no per-test timeout, so the cap goes here.
      #
      # `timeout-minutes` rather than the `timeout` command: coreutils' `timeout` is NOT on macOS
      # runners (it is `gtimeout`, and only if coreutils was installed), so wrapping the command in
      # it failed the macOS leg in 0s with `timeout: command not found`. The step-level field is
      # built into Actions, works identically on all three runners, and marks the step as timed out
      # rather than leaving a bare exit code to interpret.
      - name: Test Rust runtime
        working-directory: runtime
        timeout-minutes: 20
        run: cargo test --release --locked

      # Build the sidecar before the parity gate below. dist:* would do this anyway; doing it here means
      # a sidecar that cannot even be produced fails in seconds rather than after a full Next build.
      - name: Build the sidecar
        run: npm run build:runtime

      # The JS side, gated here because NOTHING ELSE GATES IT ON A TAG.
      #
      # ci.yml triggers on `push: branches-ignore`, which matches branch pushes only — a tag push runs
      # this workflow and nothing else. Without these two steps, tagging a commit whose tests were never
      # green produces installers all the same, and the first person to find out is a user.
      #
      # After "Build the sidecar" on purpose: the sub-agent tests drive the real binary, and
      # ZERAIX_REQUIRE_SIDECAR makes their absence a failure rather than a silent skip.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        env:
          ZERAIX_REQUIRE_SIDECAR: "1"
        run: npm run test:ci

      # The gate that says the sidecar may serve real tool calls. Stage 1 contract: the Rust tools must
      # return byte-IDENTICAL output to the JS handlers they stand in for, because a model reads those
      # strings and the renderer parses them. Runs the real handlers and the real sidecar against one
      # shared tree and diffs every byte; non-zero exit on any divergence.
      #
      # It runs on BOTH matrix legs deliberately. Directory iteration order is not the same on the two
      # platforms -- libuv byte-sorts readdir via scandir() on POSIX, while Windows reads NTFS order --
      # and a Windows-only divergence in search_in_files sat undetected behind a green Linux report
      # until this was first run on Windows. Packaged builds now default to the sidecar, so this is the
      # difference between shipping the JS behaviour and shipping something subtly unlike it.
      - name: A/B parity
        run: node --import ./scripts/electron-stub-hook.mjs scripts/ab-runtime-parity.mjs

      - name: Check required config
        shell: bash
        env:
          API: ${{ vars.NEXT_PUBLIC_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL }}
          HAS_API_VAR: ${{ vars.NEXT_PUBLIC_API_BASE_URL != '' }}
          HAS_API_SECRET: ${{ secrets.NEXT_PUBLIC_API_BASE_URL != '' }}
          HAS_GOOGLE_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID != '' }}
          HAS_GOOGLE_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET != '' }}
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL   as repository Variable : $HAS_API_VAR"
          echo "NEXT_PUBLIC_API_BASE_URL   as repository Secret   : $HAS_API_SECRET"
          echo "GOOGLE_OAUTH_CLIENT_ID     as repository Secret   : $HAS_GOOGLE_ID"
          echo "GOOGLE_OAUTH_CLIENT_SECRET as repository Secret   : $HAS_GOOGLE_SECRET"
          echo "resolved NEXT_PUBLIC_API_BASE_URL length          : ${#API}"
          fail=0
          if [ -z "$API" ]; then
            echo "::error::NEXT_PUBLIC_API_BASE_URL is empty. Add it under Settings > Secrets and variables > Actions, on either the Variables tab (preferred) or the Secrets tab. Environment secrets do NOT work: no job in this workflow declares 'environment:'."
            fail=1
          else
            case "$API" in
              http://*|https://*) ;;
              *) echo "::error::NEXT_PUBLIC_API_BASE_URL must be an absolute URL starting with http:// or https:// (got ${#API} chars). Check for stray quotes, a leading 'NEXT_PUBLIC_API_BASE_URL=' prefix, or whitespace."; fail=1 ;;
            esac
          fi
          if [ "$HAS_GOOGLE_ID" != "true" ]; then
            echo "::error::GOOGLE_OAUTH_CLIENT_ID is empty. Add it as a repository Secret (not a Variable, not an environment secret)."
            fail=1
          fi
          exit $fail

      # Export code-signing credentials ONLY when they are actually set.
      # A defined-but-empty CSC_LINK is worse than an absent one: electron-builder treats ""
      # as "a certificate path was given", resolves it against the project dir, finds a
      # directory and hard-fails with "<projectDir> not a file"
      # (app-builder-lib/out/codeSign/codesign.js:27). It only skips signing gracefully when
      # the variable is absent entirely. A YAML `env:` block cannot express "absent" — an
      # unset secret renders as "" — so the values are funnelled through $GITHUB_ENV instead.
      # Add the secrets later and signing turns on with no workflow change.
      #
      # Each platform gets ONLY its own certificate, because electron-builder silently falls
      # back across them: getCscLink("WIN_CSC_LINK") resolves to `WIN_CSC_LINK ?? CSC_LINK`
      # (app-builder-lib/out/platformPackager.js). Exporting CSC_LINK on the Windows runner
      # while WIN_CSC_LINK is unset therefore signs the NSIS installer with the *Apple*
      # Developer ID .p12 — which is what shipped in v1.7.0/v1.8.0 and broke Windows
      # auto-update: an Apple Developer ID leaf carries the critical Apple extension
      # 1.2.840.113635.100.6.1.13, so Windows chain-building rejects it (CERT_E_CRITICAL) and
      # Get-AuthenticodeSignature never returns Valid. electron-updater runs exactly that
      # check after downloading, so every update failed post-download with
      # ERR_UPDATER_INVALID_SIGNATURE. See the "Verify Windows signature" gate below.
      - name: Export signing credentials (if configured)
        shell: bash
        env:
          IN_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          IN_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          exported=0
          export_if_set() {
            local value="${!1}" target="$2"
            [ -n "$value" ] || return 0
            {
              echo "${target}<<__CSC_EOF__"
              echo "$value"
              echo "__CSC_EOF__"
            } >> "$GITHUB_ENV"
            echo "exported ${target}"
            exported=1
          }
          if [ "$MATRIX_NAME" = "windows" ]; then
            # Authenticode .pfx only. CSC_* is deliberately not exported here — see above.
            export_if_set IN_WIN_CSC_LINK WIN_CSC_LINK
            export_if_set IN_WIN_CSC_KEY_PASSWORD WIN_CSC_KEY_PASSWORD
          else
            # Apple Developer ID .p12 only.
            export_if_set IN_CSC_LINK CSC_LINK
            export_if_set IN_CSC_KEY_PASSWORD CSC_KEY_PASSWORD
          fi
          if [ "$exported" = "0" ]; then
            echo "no signing certificate configured for ${MATRIX_NAME} — an unsigned installer will be produced"
          fi

      # scripts/afterAllArtifactBuild.cjs signs the DMG by looking up the Developer ID with a
      # plain `security find-identity`, i.e. against the ambient keychain search list. On a dev
      # Mac that finds the identity in the login keychain. On CI it finds nothing: electron-builder
      # imports CSC_LINK into a *temporary* keychain and deletes it when the build finishes
      # (macPackager.ts registers removeKeychain via disposeOnBuildFinish; packager.ts drains those
      # disposers inside packager.build(), which resolves before index.ts invokes
      # afterAllArtifactBuild). The .app is signed by then, but the DMG is not — so the hook would
      # skip silently and ship an unsigned DMG.
      #
      # Importing the same cert into a keychain we own gives the hook an identity that outlives
      # electron-builder's. This does not collide with electron-builder's own signing: when
      # CSC_LINK is set it scopes its find-identity to its private keychain (macCodeSign.ts).
      - name: Import Developer ID into a persistent keychain
        if: matrix.name == 'macos'
        shell: bash
        env:
          CERT_B64: ${{ secrets.CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "no CSC_LINK configured — skipping keychain import (DMG will not be signed)"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/dmg-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/dmg-signing-cert.p12"
          # Fail loudly on a malformed secret rather than importing an empty file.
          echo "$CERT_B64" | base64 --decode > "$CERT_PATH" || {
            echo "::error::CSC_LINK is not valid base64"; exit 1; }
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Disable the lock-on-idle timeout: notarization can block for >5min inside the hook,
          # and a relocked keychain would make the later codesign fail.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Let codesign use the key without an interactive prompt (there is no UI on a runner).
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend to the search list, preserving the existing entries (System.keychain etc).
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"
          echo "identities visible to the afterAllArtifactBuild hook:"
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "Developer ID Application:" || {
            echo "::error::no Developer ID Application identity after import — is the .p12 missing its private key (exported from 'Certificates' instead of 'My Certificates')?"; exit 1; }

      - name: Build installer (${{ matrix.name }})
        run: pnpm run ${{ matrix.script }}
        env:
          # Backend API baked into the client bundle at build time. Required: .env.production
          # is gitignored and never reaches the runner. If unset, GitHub renders this as ""
          # — which fails the z.string().url() parse in src/lib/env.ts, so the build errors
          # out rather than silently shipping a wrong endpoint.
          # Accepts either a repository Variable or a Secret, so it works whichever tab it
          # was added on. Not actually secret (it ships inside the installer), so the
          # Variable is preferred — as a Secret it gets masked to *** in build logs.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL }}

          # Google OAuth default credentials baked in by scripts/gen-google-defaults.mjs.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

          # Code signing (optional): WIN_CSC_* / CSC_* are deliberately NOT listed here.
          # A step-level `env:` entry overrides $GITHUB_ENV, so listing them would re-introduce
          # the empty values that the "Export signing credentials" step exists to avoid.
          # Windows and macOS need different certificates — WIN_CSC_* is the Authenticode .pfx,
          # CSC_* the Apple Developer ID .p12 — each stored as base64 (`base64 -w0 cert.p12`).

          # macOS notarization (optional) — consumed by scripts/afterAllArtifactBuild.cjs.
          # Provide EITHER the Apple ID trio OR the App Store Connect API-key trio.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

          # No credentials for the bundled QEMU binaries: download:bin:* fetches them from the public
          # Hugging Face repo now. The OSS_* block that used to sit here was the authenticated fallback
          # for when the CDN was unavailable — and it could never have worked anyway, since the Windows
          # object was private and the runner had no way to know that.

          # Let electron-builder use a token if it ever needs GitHub (avoids anonymous rate limits).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # scripts/afterAllArtifactBuild.cjs skips signing gracefully when it finds no Developer ID
      # or no notarization credentials. That is right for a local build and wrong for a release:
      # without this gate, a missing or malformed CSC_LINK produces a green run and a DMG that
      # Gatekeeper rejects on the user's machine — a failure that only surfaces after publishing.
      - name: Verify macOS signature + notarization
        if: matrix.name == 'macos'
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(dist-electron/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::no DMG was produced"
            exit 1
          fi
          fail=0
          for dmg in "${dmgs[@]}"; do
            echo "--- $dmg"
            codesign --verify --strict --verbose=2 "$dmg" || {
              echo "::error::$dmg is not validly signed"; fail=1; continue; }
            codesign -dv --verbose=4 "$dmg" 2>&1 | grep -q "Authority=Developer ID Application" || {
              echo "::error::$dmg is not signed with a Developer ID Application certificate (ad-hoc or wrong cert?)"; fail=1; }
            xcrun stapler validate "$dmg" || {
              echo "::error::$dmg has no stapled notarization ticket"; fail=1; }
            spctl -a -t open --context context:primary-signature -v "$dmg" || {
              echo "::error::$dmg fails Gatekeeper assessment"; fail=1; }
          done
          exit $fail

      # Run the exact check electron-updater runs on the user's machine after it finishes
      # downloading (electron-updater/out/windowsExecutableCodeSignatureVerifier.js calls
      # Get-AuthenticodeSignature and requires Status == Valid). If the installer does not pass
      # here, no Windows client can ever apply the update — and the failure is invisible until
      # after publishing, because the .exe installs fine by hand either way.
      #
      # NotSigned is allowed and only warned about: with no Authenticode certificate configured,
      # electron-builder writes no publisherName into app-update.yml and electron-updater skips
      # verification entirely, so auto-update still works (users just see SmartScreen on first
      # install). Anything signed-but-not-Valid is a hard failure: publisherName IS written in
      # that case, so the client verifies and refuses.
      - name: Verify Windows signature
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -Path dist-electron -Filter *.exe -File)
          if ($exes.Count -eq 0) {
            Write-Output "::error::no .exe was produced"
            exit 1
          }
          $fail = 0
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature -LiteralPath $exe.FullName
            Write-Output "--- $($exe.Name): $($sig.Status)"
            if ($sig.Status -eq 'NotSigned') {
              Write-Output "::warning::$($exe.Name) is unsigned (no WIN_CSC_LINK configured). Auto-update still works; first install shows SmartScreen."
              continue
            }
            if ($sig.Status -ne 'Valid') {
              Write-Output "::error::$($exe.Name) is signed but Windows rejects the signature ($($sig.Status): $($sig.StatusMessage)). electron-updater will refuse this update with ERR_UPDATER_INVALID_SIGNATURE. Is WIN_CSC_LINK an Authenticode certificate from a CA in the Windows root store (not an Apple Developer ID .p12)?"
              $fail = 1
              continue
            }
            Write-Output "    signer: $($sig.SignerCertificate.Subject)"
          }
          exit $fail

      # The failure this catches is silent and total: if the sidecar is missing from the package,
      # binaryPath() finds nothing, the bridge latches `disabled`, and every tool call falls through to
      # the JS handlers — a working app that simply never uses the runtime it shipped. Nothing else in
      # this pipeline would notice, because nothing else fails.
      - name: Verify the sidecar was packaged
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "macos" ]; then
            APP=$(find dist-electron -maxdepth 2 -name "*.app" -print -quit)
            [ -n "$APP" ] || { echo "::error::no .app found"; exit 1; }
            BIN="$APP/Contents/Resources/runtime/zeraix-agent-runtime"
            [ -x "$BIN" ] || { echo "::error::sidecar missing or not executable at $BIN"; exit 1; }
            # Under hardenedRuntime an unsigned nested Mach-O fails notarization, so assert the
            # signature rather than merely the file's presence.
            codesign --verify --strict "$BIN" || { echo "::error::sidecar is not validly signed"; exit 1; }
            echo "sidecar packaged and signed: $("$BIN" --version)"
          else
            BIN=$(find dist-electron -path "*/resources/runtime/zeraix-agent-runtime.exe" -print -quit)
            [ -n "$BIN" ] || { echo "::error::sidecar missing from the unpacked package"; exit 1; }
            echo "sidecar packaged: $BIN"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  # Attach all installers to a single GitHub Release. Runs only for tag pushes.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true # publish manually after you've verified the assets
          generate_release_notes: true
