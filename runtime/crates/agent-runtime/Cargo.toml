[package]
name = "agent-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "zeraix-agent-runtime"
path = "src/main.rs"

[dependencies]
agent-core = { workspace = true }
agent-journal = { workspace = true }
agent-dispatch = { workspace = true }
agent-provider = { workspace = true }
agent-loop = { workspace = true }
agent-context = { workspace = true }
agent-tools = { workspace = true }
agent-process = { workspace = true }
agent-sandbox = { workspace = true }
agent-mcp = { workspace = true }
agent-subagents = { workspace = true }
agent-scheduler = { workspace = true }
agent-resource = { workspace = true }
agent-audit = { workspace = true }
agent-events = { workspace = true }
agent-permission = { workspace = true }
agent-ipc = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }

[dev-dependencies]
tempfile = "3"
# A local HTTPS server for tests/transport.rs, which pins that the OS certificate store is trusted. Already in the
# lockfile through reqwest; `ring` because it is the provider the build already carries.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
