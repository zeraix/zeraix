# Zeraix Agent Runtime — Rust workspace.
#
# See docs/Zeraix-Agent-Runtime-Rust.md for the target architecture and
# docs/agent-runtime-migration.md for how this replaces the JS runtime stage by stage.
#
# Crate boundaries are deliberate (spec §3): no `runtime.rs` / `utils.rs` catch-alls. A crate is added
# by the stage that first needs it, so an empty crate never sits in the tree pretending to be a
# boundary.
#
# agent-loop is the Agent Loop itself (TODO §2.1). Additive: nothing routes to it yet, the same way the
# scheduler, the process runtime and the permission runtime each landed a stage before their wiring.
[workspace]
resolver = "3"
members = [
    "crates/agent-audit",
    "crates/agent-context",
    "crates/agent-core",
    "crates/agent-dispatch",
    "crates/agent-events",
    "crates/agent-mcp",
    "crates/agent-permission",
    "crates/agent-provider",
    "crates/agent-process",
    "crates/agent-sandbox",
    "crates/agent-resource",
    "crates/agent-scheduler",
    "crates/agent-subagents",
    "crates/agent-tools",
    "crates/agent-ipc",
    "crates/agent-journal",
    "crates/agent-loop",
    "crates/agent-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
agent-audit = { path = "crates/agent-audit" }
agent-context = { path = "crates/agent-context" }
agent-core = { path = "crates/agent-core" }
agent-dispatch = { path = "crates/agent-dispatch" }
agent-events = { path = "crates/agent-events" }
agent-mcp = { path = "crates/agent-mcp" }
agent-permission = { path = "crates/agent-permission" }
agent-provider = { path = "crates/agent-provider" }
agent-process = { path = "crates/agent-process" }
agent-sandbox = { path = "crates/agent-sandbox" }
agent-resource = { path = "crates/agent-resource" }
agent-scheduler = { path = "crates/agent-scheduler" }
agent-subagents = { path = "crates/agent-subagents" }
agent-tools = { path = "crates/agent-tools" }
agent-ipc = { path = "crates/agent-ipc" }
agent-journal = { path = "crates/agent-journal" }
agent-loop = { path = "crates/agent-loop" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
regex = "1"
chrono = "0.4"
encoding_rs = "0.8"
landlock = "0.4"
# HTTP client for remote/cloud MCP servers, and later for inference (D3).
#
# rustls rather than native-tls: it keeps the sidecar free of a system TLS dependency across all four
# dist:* targets, which is what a native-tls build would add. Default features are off because they pull
# in a second TLS stack and blocking support this runtime has no use for. Approved in
# docs/agent-runtime-dependency-review.md (D14): 59 crates that compile, 85 in the lockfile.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "charset", "http2"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[workspace.dependencies.nix]
version = "0.29"
features = ["signal", "process", "resource"]

# Job objects, so a spawned command tree cannot outlive the runtime that started it. Only the three
# feature groups the job code touches: windows-sys compiles per feature, and taking the whole Win32
# surface would add build time for bindings nothing calls. See agent-process/src/job.rs.
[workspace.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
